<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فرسان الأطلس — الحروف</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="assets/icon/favicon-48.png?v=2">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png?v=2">
<link rel="manifest" href="assets/icon/site.webmanifest">
<meta name="theme-color" content="#241a46">
<meta name="author" content="المهدي وهبي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css?v=23">
<style>
.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card .in{display:flex;flex-direction:column;gap:12px;padding:14px}
.win{position:relative;height:190px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 2.5px var(--ink);cursor:pointer}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 66%,var(--light) 0%,var(--dark) 58%,#0c0a18 100%)}
.win::after{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.09) 0 10deg,transparent 10deg 45deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win canvas{position:relative;z-index:1;width:100%;height:100%;display:block}
.ped{position:absolute;z-index:0;left:50%;bottom:6px;width:56%;height:22px;margin-left:-28%;border-radius:50%;background:linear-gradient(180deg,#6a6490,#2a2440);box-shadow:0 0 0 2.5px var(--ink)}
.name{text-align:center;margin-top:-30px;position:relative;z-index:2}
.name .ribbon{font-size:24px;background:linear-gradient(180deg,var(--light),var(--col) 55%,var(--dark))}
.name .ribbon::before,.name .ribbon::after{background:var(--dark)}
.desc{text-align:center;font-size:17px;margin:0}
.trait{background:rgba(255,210,74,.12);border:2px solid rgba(255,210,74,.35);border-radius:10px;padding:6px 10px;color:var(--gold);text-align:center;font-weight:800}
.trait small{display:block;font-size:12px;color:#d8c48a;font-weight:600}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:15px}
.meter{height:14px;border-radius:99px;background:#2a2238;box-shadow:0 0 0 2px var(--ink);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#fff3a0,#ffc82a 55%,#b8700a);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.skill{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px}
.skill b{display:block;font-size:17px;color:#bfe0ff}
.skill span{font-size:14px;color:var(--muted);font-weight:600}
.type{position:absolute;top:10px;right:10px;z-index:2}
.count{font-size:18px}
.hint{text-align:center;margin-top:28px;color:var(--muted)}
</style>
</head>
<body>
<div class="page fade-in">
  <div class="topbar">
    <a class="btn dark small" href="index.html">→ رجوع</a>
    <div class="mid"><span class="ribbon gold">📜 الحروف ديالك</span></div>
    <span class="pill count" id="count"></span>
  </div>
  <p class="hint" style="margin:8px 0 26px">كليكي على الحرف باش تشوفو كيضرب ✨</p>
  <div class="grid cards" id="cards"></div>
</div>
<template id="tpl">
  <article class="panel card"><span class="star s1"></span><span class="star s2"></span><span class="star s3"></span><span class="star s4"></span>
    <div class="in">
      <div class="win"><span class="pill type"></span><div class="ped"></div><canvas></canvas></div>
      <div class="name"><span class="ribbon"></span></div>
      <p class="desc"></p>
      <div class="trait"><small>الخاصية ديالو</small><span class="pas"></span></div>
      <div class="stats"></div>
      <div class="skill"><span class="key">K</span><div><b class="kn"></b><span class="kd"></span></div></div>
      <div class="skill"><span class="key">L</span><div><b class="ln"></b><span class="ld"></span></div></div>
    </div>
  </article>
</template>
<p class="credit">🎮 لعبة من تطوير <b>المهدي وهبي</b> • © 2026</p>
<script src="js/core.js?v=23"></script>
<script src="js/data.js?v=23"></script>
<script src="js/letters.js?v=23"></script>
<script src="js/site.js?v=23"></script>
<script>
'use strict';
const MAX={hp:170,spd:3.5,dmg:19,rate:1/13};
document.getElementById('count').textContent='عندك '+FOUND_LIST.length+(FOUND_LIST.length===1?' حرف':' حروف');
const box=document.getElementById('cards'),tpl=document.getElementById('tpl');
for(const i of FOUND_LIST){
  const H=HEROES[i],L=LET[i],el=tpl.content.firstElementChild.cloneNode(true);
  el.style.setProperty('--col',L.col);el.style.setProperty('--light',L.light);el.style.setProperty('--dark',L.dark);
  el.querySelector('.type').textContent=H.type==='melee'?'⚔ من قريب':'🏹 من بعيد';
  el.querySelector('.name .ribbon').textContent=H.name;
  el.querySelector('.desc').textContent=H.desc;
  el.querySelector('.pas').textContent='✦ '+H.pas;
  el.querySelector('.kn').textContent=H.k.name;el.querySelector('.kd').textContent=H.kd;
  el.querySelector('.ln').textContent=H.l.name;el.querySelector('.ld').textContent=H.ld;
  const st=[['❤ الصحة',H.hp/MAX.hp],['⚔ القوة',H.dmg/MAX.dmg],['💨 السرعة',H.spd/MAX.spd],['⏱ الإيقاع',(1/H.atkCd)/MAX.rate]];
  el.querySelector('.stats').innerHTML=st.map(([n,v])=>'<span>'+n+'</span><div class="meter"><i style="width:'+Math.round(Math.min(1,v)*100)+'%"></i></div>').join('');
  box.appendChild(el);
  portrait(el.querySelector('canvas'),i,{base:18});
}
</script>
</body>
</html>
